name: Business Lunch Daily

on:
  schedule:
    # GitHub Actions cron is always UTC (no timezone field support).
    # 04:45 UTC = 07:45 Europe/Moscow (UTC+3, no DST).
    # Set well before the 09:00 target because scheduled runs on GitHub
    # Actions are frequently delayed (observed ~2h20m delay on 2026-07-14).
    - cron: "30 3 * * 1-5"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
